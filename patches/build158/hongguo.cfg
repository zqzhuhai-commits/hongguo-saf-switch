renderer=deko3d
hwdec=auto
# ---- 上面两行是设置，请留在文件最前面（程序从上往下读） ----
#
# renderer=deko3d   用 GPU 渲染，帧率最好。★ 删掉这一行程序会退回"软件渲染"，1080P 会明显卡。
# hwdec=auto        视频解码交给硬件（这本就是默认值，写在这里只是为了看得见）。
#
# 需要时再加的其它选项（一行一个，加在文件末尾即可）：
#   app.fps.show=yes      屏幕左上角显示帧率（想知道卡不卡就看它）
#   home.tiers=no         主页不显示分类标题，只留一格格海报
#   ui.scale=1080p        界面逻辑分辨率（默认 720p；电视上想字大一点可以试）
#   home.layout=list      主页改成"一行一张"的竖列表
#
# 这个文件也可以整个删掉 —— 程序会照默认值跑，但那就没有 deko3d 这一行了。
# 出问题时把 sdmc:/switch/hongguo.log 发我。

language=zh
