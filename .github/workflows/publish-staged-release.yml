name: Publish staged Switch NSP
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-staged-release.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d204f5014e11abf8d582f104556f750e2fc0a893
          persist-credentials: false
      - name: Assemble and publish verified NSP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ ! -d .release-parts/nsp ]; then echo 'No staged package; nothing to publish.'; exit 0; fi
          mkdir -p /tmp/release
          cat .release-parts/nsp/part-* > /tmp/release/Hongguo-Switch-0.1.4-alpha.1.nsp
          cp .release-parts/Switch-verification.json /tmp/release/
          cd /tmp/release
          sha256sum Hongguo-Switch-0.1.4-alpha.1.nsp > SHA256SUMS
          expected=$(python3 -c 'import json; print(json.load(open("Switch-verification.json"))["sha256"])')
          actual=$(sha256sum Hongguo-Switch-0.1.4-alpha.1.nsp | cut -d' ' -f1)
          test "$expected" = "$actual"
          gh release create v0.1.4-alpha.1 Hongguo-Switch-0.1.4-alpha.1.nsp SHA256SUMS Switch-verification.json \
            --repo "$GH_REPO" --target "$RELEASE_TARGET" \
            --title '红果短剧Switch客户端 v0.1.4' --prerelease \
            --notes '0.1.4：六列封面宫格、整张卡片触屏点击、中文缺字修正、每行十集横向选集。点击播放画面或按X呼出菜单，支持横竖切换、自动连播开关和手动重试。播放失败最多自动重试三次，并刷新播放源。构建、连播与重试逻辑检查和安装包校验通过；新界面与旋转仍待实机复测。部分内容源持续异常时仍可能无法播放。'
