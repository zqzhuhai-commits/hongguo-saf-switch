name: Publish staged Switch NSP
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-staged-release.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9d9245b766cef446b7d520309b8d0bc38fc09778
          persist-credentials: false
      - name: Assemble and publish verified NSP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ ! -d .release-parts/nsp ]; then echo 'No staged package; nothing to publish.'; exit 0; fi
          mkdir -p /tmp/release
          cat .release-parts/nsp/part-* > /tmp/release/Hongguo-Switch-0.1.3-alpha.1.nsp
          cp .release-parts/Switch-verification.json /tmp/release/
          cd /tmp/release
          sha256sum Hongguo-Switch-0.1.3-alpha.1.nsp > SHA256SUMS
          expected=$(python3 -c 'import json; print(json.load(open("Switch-verification.json"))["sha256"])')
          actual=$(sha256sum Hongguo-Switch-0.1.3-alpha.1.nsp | cut -d' ' -f1)
          test "$expected" = "$actual"
          gh release create v0.1.3-alpha.1 Hongguo-Switch-0.1.3-alpha.1.nsp SHA256SUMS Switch-verification.json \
            --repo "$GH_REPO" --target "$RELEASE_TARGET" \
            --title '红果短剧Switch客户端 v0.1.3' --prerelease \
            --notes '针对启动约3秒闪退的诊断试验版：接口与封面改用固定2 MiB栈工作线程，接口请求统一调度，首页分类分别加载，新增本机runtime.log。尚未在Switch实机复测，崩溃根因待日志确认。安装包结构与密钥扫描校验通过。'
