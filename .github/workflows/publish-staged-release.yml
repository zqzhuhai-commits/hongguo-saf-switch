name: Publish staged Switch NSP
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-staged-release.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0161f8c58adcd8a886e51aa600bfa68219be9876
          persist-credentials: false
      - name: Assemble and publish verified NSP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ ! -d .release-parts/nsp ]; then echo 'No staged package; nothing to publish.'; exit 0; fi
          mkdir -p /tmp/release
          cat .release-parts/nsp/part-* > /tmp/release/Hongguo-Switch-0.1.8-alpha.1.nsp
          cp .release-parts/Switch-verification.json /tmp/release/
          cd /tmp/release
          sha256sum Hongguo-Switch-0.1.8-alpha.1.nsp > SHA256SUMS
          expected=$(python3 -c 'import json; print(json.load(open("Switch-verification.json"))["sha256"])')
          actual=$(sha256sum Hongguo-Switch-0.1.8-alpha.1.nsp | cut -d' ' -f1)
          test "$expected" = "$actual"
          gh release create v0.1.8-alpha.1 Hongguo-Switch-0.1.8-alpha.1.nsp SHA256SUMS Switch-verification.json \
            --repo "$GH_REPO" --target "$RELEASE_TARGET" \
            --title '红果短剧Switch客户端 v0.1.8' --prerelease \
            --notes '0.1.8：仅将播放操作提示移到屏幕最底边，采用底部对齐并留 4 个逻辑像素间距。保持原来的 16 号字号、颜色和左侧位置。进度条仍随菜单显示，拖动跳转及长按临时 2 倍速操作继续保留。原生编译和安装包校验通过，实际显示位置待 Switch 实机复测。'
