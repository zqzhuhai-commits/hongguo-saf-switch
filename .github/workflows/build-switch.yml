name: Build 红果短剧Switch客户端
on:
  push:
    branches: [main, full-158-source, latency-quality, fix/playback-fallback]
    paths: ['native/**', 'romfs/**', 'CMakeLists.txt', 'scripts/**', 'npdm.json', 'icon.jpg', 'tests/**', '.github/workflows/build-switch.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Playback protocol regression tests
        run: for test in tests/*.cjs; do node "$test" || exit 1; done
  build:
    needs: protocol-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Native policy and configuration tests
        run: |
          g++ -std=c++17 -Inative tests/playback_policy.cpp -o /tmp/policy && /tmp/policy
          g++ -std=c++17 -Inative tests/playback_touch.cpp -o /tmp/touch && /tmp/touch
          g++ -std=c++17 -Inative tests/app_config.cpp -o /tmp/config && /tmp/config
          g++ -std=c++17 -Inative tests/episode_groups.cpp -o /tmp/groups && /tmp/groups
          g++ -std=c++17 -Inative tests/stream_request.cpp -o /tmp/request && /tmp/request
          g++ -std=c++17 -pthread -Itests/host -Inative tests/worker_priority.cpp native/workers.cpp -o /tmp/workers && /tmp/workers
      - name: Fetch pinned development dependencies
        run: sh scripts/fetch-deps.sh
      - name: Configure and build native app
        run: |
          cmake -S . -B build -DPLATFORM_SWITCH=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target package-input -j2
      - name: Inspect binaries and package inputs
        run: |
          test -s build/package/exefs/main
          test -s build/package/exefs/main.npdm
          test -s build/package/control/control.nacp
          test -s build/hongguo-switch.nro
          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-readelf -h build/hongguo-switch.elf
          python3 scripts/verify-input.py build/package
          dkp-pacman -Q > build/package/BUILD-PACKAGES.txt
          cp -r licenses build/package/romfs/licenses
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: switch-package-input
          path: |
            build/package/
            build/hongguo-switch.nro
            build/official-player-probe.json
          retention-days: 7

      - name: Preserve exact build symbols for crash reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: switch-debug-symbols
          path: build/hongguo-switch.elf
          retention-days: 90
