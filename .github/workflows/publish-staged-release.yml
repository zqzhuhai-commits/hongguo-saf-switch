name: Publish formal Switch release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-staged-release.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Promote the exact approved binary to the formal release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          gh release download v0.1.8-alpha.1 --repo "$GH_REPO" --pattern Hongguo-Switch-0.1.8-alpha.1.nsp --dir /tmp/release
          mv /tmp/release/Hongguo-Switch-0.1.8-alpha.1.nsp /tmp/release/Hongguo-Switch-0.1.8.nsp
          cp docs/Switch-verification.json /tmp/release/
          cd /tmp/release
          expected=$(python3 -c 'import json; print(json.load(open("Switch-verification.json"))["sha256"])')
          printf '%s  %s\n' "$expected" Hongguo-Switch-0.1.8.nsp > SHA256SUMS
          sha256sum -c SHA256SUMS
          gh release create v0.1.8 Hongguo-Switch-0.1.8.nsp SHA256SUMS Switch-verification.json \
            --repo "$GH_REPO" --target "$RELEASE_TARGET" --latest \
            --title '红果短剧Switch客户端 v0.1.8 正式版' \
            --notes '0.1.8 正式版，经用户确认发布。安装包与已交付的 0.1.8 预发布版本完全一致，仅改为正式发布并规范下载文件名。支持封面宫格、横向选集、官网公开源播放、点击画面显示控制菜单与可拖动进度条、长按临时 2 倍速、自动连播、失败重试及横竖切换。操作提示保持原字号，放在屏幕底边。源码、安装包校验记录和 SHA256SUMS 已同步。部分内容源不可用的集数仍可能无法播放。'
